name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No install step: the worker has zero runtime dependencies and the
      # suite (plus the coverage runner) uses only node:test / node:child_process.
      # test:coverage runs run-coverage.mjs, which enforces PER-MODULE line/branch
      # floors (Node's own flags are global-only) and exits non-zero if any
      # module or the overall total drops below its floor — so a regression
      # fails this job.
      - run: npm run test:coverage
