name = "emotional-infra-middleware"
main = "index.js"
compatibility_date = "2023-09-19"

# Serves frontend/ as static assets from the same Worker/origin as the API.
# Requests that match a file here (e.g. /, /app.js, /styles.css) are served
# directly; anything else (e.g. /v1/turn) falls through to index.js. This is
# what lets a single Git-connected Worker deploy be the whole live demo.
[assets]
directory = "../frontend"

# API_KEY is optional. Unset -> demo mode (no auth required on /v1/turn).
# Set with: wrangler secret put API_KEY

# ANTHROPIC_API_KEY is optional. Unset -> replies are simulated locally
# (still action-aware) instead of calling a real model.
# Set with: wrangler secret put ANTHROPIC_API_KEY

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5"

# Session storage. The Worker persists per-session state (turn count, sentiment
# history, crisis count, and message history) in this KV namespace, keyed by
# session id, so state survives across isolates, requests, and deploys. If this
# binding is absent the Worker falls back to an in-memory Map (single-isolate
# only) — handy for the demo, not for production.
#
# Before your first deploy, create the namespace and paste its id below:
#     npx wrangler kv namespace create SESSIONS
#     npx wrangler kv namespace create SESSIONS --preview   # for `wrangler dev`
# then replace the placeholder ids with the ones it prints.
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_NAMESPACE_ID"
