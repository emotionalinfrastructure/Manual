name = "emotional-infra-middleware"
main = "index.js"
compatibility_date = "2023-09-19"

# Serves frontend/ as static assets from the same Worker/origin as the API.
# Requests that match a file here (e.g. /, /app.js, /styles.css) are served
# directly; anything else (e.g. /v1/turn) falls through to index.js. This is
# what lets a single Git-connected Worker deploy be the whole live demo.
[assets]
directory = "../frontend"

# API_KEY is optional. Unset -> demo mode (no auth required on /v1/turn).
# Set with: wrangler secret put API_KEY

# ANTHROPIC_API_KEY is optional. Unset -> replies are simulated locally
# (still action-aware) instead of calling a real model.
# Set with: wrangler secret put ANTHROPIC_API_KEY

# Durable Object holding per-session state, so a conversation's history and
# crisis count survive isolate recycling. Without this binding the Worker falls
# back to in-memory state, which is fine for a local demo but means sessions
# reset whenever the isolate is replaced.
[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "SessionObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionObject"]

# KV fallback, used when no Durable Object binding is present. Durable Objects
# require a paid Workers plan; on the free plan, delete or comment out the
# [[durable_objects.bindings]] and [[migrations]] blocks above and the Worker
# picks this up automatically — sessions still survive isolate recycling.
#
# Weaker than the Durable Object path: KV's read-modify-write is not atomic, so
# simultaneous turns on one session can lose a crisis increment. Still far
# better than in-memory, which loses the whole session on every recycle.
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "94036ebdf93045f7ab005a68c2046906"
preview_id = "178546a23fbc43a69088fc5ba17b93c8"

[vars]
ANTHROPIC_MODEL = "claude-sonnet-5"
